  <text x="550" y="534" text-anchor="middle" font-size="12" font-weight="600" fill="#4a5568">Bedrock AgentCore Runtime</text>

  <text x="270" y="565" font-size="11" fill="#4a5568">Scout</text>
  <text x="330" y="565" font-size="11" fill="#a0aec0">→ dedupe →</text>
  <text x="420" y="565" font-size="11" fill="#4a5568">Research</text>
  <text x="500" y="565" font-size="11" fill="#a0aec0">→</text>
  <text x="520" y="565" font-size="11" fill="#4a5568">Score</text>
  <text x="575" y="565" font-size="11" fill="#a0aec0">→ gate →</text>
  <text x="650" y="565" font-size="11" fill="#4a5568">Draft</text>
  <text x="700" y="565" font-size="11" fill="#a0aec0">→</text>
