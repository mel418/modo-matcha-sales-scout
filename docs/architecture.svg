  <text x="550" y="626" text-anchor="middle" font-size="10" fill="#a0aec0">Scorer reads AgentCore Memory for learned preferences</text>

  <line x1="550" y1="642" x2="550" y2="665" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowDashed)"/>

  <rect x="330" y="665" width="440" height="60" rx="6" fill="#ffffff" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="550" y="688" text-anchor="middle" font-size="12" fill="#4a5568">FastAPI + HTMX Dashboard (App Runner)</text>
  <text x="550" y="706" text-anchor="middle" font-size="10" fill="#a0aec0">approve → SES sends  |  reject → written to AgentCore Memory</text>

  <text x="550" y="750" text-anchor="middle" font-size="10" fill="#a0aec0">Full detail, cost model, and 12-day build plan: SPEC.md</text>
