  <text x="690" y="186" text-anchor="middle" font-size="11" fill="#718096">Strands + Bedrock</text>
  <text x="690" y="202" text-anchor="middle" font-size="11" fill="#718096">structured output</text>
  <text x="690" y="218" text-anchor="middle" font-size="10" fill="#a0aec0">scores fit, drafts the email</text>

