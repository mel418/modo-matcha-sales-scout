  <text x="550" y="477" text-anchor="middle" font-size="10" fill="#a0aec0">long read-timeout, avoids sync-target trap</text>

  <line x1="550" y1="490" x2="550" y2="512" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowDashed)"/>

