  <text x="400" y="202" text-anchor="middle" font-size="11" fill="#718096">tool: tavily_search</text>
  <text x="400" y="218" text-anchor="middle" font-size="10" fill="#a0aec0">finds + verifies a real LA/OC signal</text>

